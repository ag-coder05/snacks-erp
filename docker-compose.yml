services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snacks_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d snacks_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://erp_user:erp_password@db:5432/snacks_erp
    depends_on:
      db:
        condition: service_healthy